name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: ${{ github.workspace }}

      - name: Test generator recovery and topic identity
        run: node --test qa/generation-identity.test.mjs

      - name: Run checks
        run: npm run check
        working-directory: ${{ github.workspace }}

  build:
    name: Build
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: ${{ github.workspace }}

      - name: Build application
        run: npm run build
        working-directory: ${{ github.workspace }}
