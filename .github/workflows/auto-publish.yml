name: Auto Multi-Language Blog Publishing Pipeline (Unit 3)

on:
  schedule:
    - cron: '20 19 * * *'
      timezone: 'Asia/Seoul'
  workflow_dispatch: # 수동 즉시 실행 지원

concurrency:
  group: blog-publish-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max
permissions:
  contents: write # 생성된 마크다운 글 커밋 및 푸시 권한

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore validated locale checkpoints
        uses: actions/cache/restore@v4
        with:
          path: .generation-checkpoints/
          key: 3ho-locale-checkpoints-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            3ho-locale-checkpoints-

      - name: Run Auto Publishing Script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          npm install --legacy-peer-deps
          node generate-all.mjs
          npm run build

      - name: Commit and Push New Posts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/post/ topics.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto published new multi-language automation posts"
          fi
          git push

      # 실패한 언어 실행에서도 검증된 원고 체크포인트를 다음 실행에 넘깁니다.
      - name: Save validated locale checkpoints
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .generation-checkpoints/
          key: 3ho-locale-checkpoints-${{ github.run_id }}-${{ github.run_attempt }}
