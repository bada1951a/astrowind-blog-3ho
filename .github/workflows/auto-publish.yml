name: Auto Multi-Language Blog Publishing Pipeline (Unit 3)

on:
  workflow_dispatch: # 수동 즉시 실행 지원

permissions:
  contents: write # 생성된 마크다운 글 커밋 및 푸시 권한

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Auto Publishing Script
        id: generator
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          npm install --legacy-peer-deps
          node generate-all.mjs

      - name: Commit and Push New Posts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/post/ topics.txt
          if ! git diff --cached --quiet; then
            git commit -m "Auto published new multi-language automation posts"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Report failure after successful language posts are retained
        if: steps.generator.outcome == 'failure'
        run: exit 1
