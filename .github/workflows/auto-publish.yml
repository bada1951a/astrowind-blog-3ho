name: Auto Multi-Language Blog Publishing Pipeline (3ho)

on:
  schedule:
    # 3호기 스케줄: 한국 시간(KST) 매일 오전 3시 00분 (03:00 KST) 1회 발행
    # UTC 기준: 18:00 (전날) (1호기 02:30, 2호기 02:45에 이은 15분 간격 분산)
    - cron: '0 18 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run Multi-Language Generator Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node generate-all.mjs

      - name: Commit and Push New Posts & Updated Topics
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/post/ topics.txt
          if git diff --staged --quiet; then
            echo "변경사항이 없습니다."
          else
            git commit -m "chore: auto-publish AI productivity blog posts"
            git push origin main
          fi
