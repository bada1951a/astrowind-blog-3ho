name: 3ho Luna Safe Review
on:
  push:
    branches:
      - review/gpt6-luna-3ho-no-publish
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: node --check generate-all.mjs
      - run: node generate-all.mjs --dry-run
      - run: npm run check:astro
      - run: npm run build
