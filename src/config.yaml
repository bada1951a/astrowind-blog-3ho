site:
  name: 'Story Daily Tech'
  site: 'https://m.storydailyview.com'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: false

# Metadata
metadata:
  title:
    default: 'Story Daily Tech'
    template: '%s — Story Daily Tech'
  description: 'Practical Life & Tech Insights, Mobile Diagnostics, and Real-World Troubleshooting.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: 'Story Daily Tech'
    type: website

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6
    post:
      isEnabled: true
      permalink: '/%slug%'
      robots:
        index: true
    list:
      isEnabled: true
      pathname: 'blog'
      robots:
        index: true
    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true
    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: true

ui:
  theme: 'system'
announcement:
  enabled: false

analytics:
  vendors:
    googleAnalytics:
      id: 'G-CDH7ZLDSDV'
