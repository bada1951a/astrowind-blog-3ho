site:
  name: 'Smart Work Insights'
  site: 'https://work.storydailyview.com'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: false

# Metadata
metadata:
  title:
    default: 'Smart Work Insights'
    template: '%s — Smart Work Insights'
  description: 'AI Tools, Practical Office Automation, and Productivity Workflows for Modern Professionals.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: 'Smart Work Insights'
    type: website

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6
    post:
      isEnabled: true
      permalink: '/%slug%'
      robots:
        index: true
    list:
      isEnabled: true
      pathname: 'blog'
      robots:
        index: true
    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true
    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: true

ui:
  theme: 'system'
announcement:
  enabled: false

analytics:
  vendors:
    googleAnalytics:
      id: 'G-1W6TYCNJK9'
